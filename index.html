<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Document</title>
</head>
<body class="py-5" style="background-color: rgb(147, 157, 166);">

        <h1 class="fw-bold">Trabalho de Visualização de Dados 2026.2</h1>

    </div>
    <hr>
    <div class="row text-center mt-2">

    </div>

        <div class="col">
            <p class="fw-bold fs-5 text-start">Gráfico Original:</p>
            <img id="img-original" class="img-fluid" style="max-height: 500px;" src="public/img/fastest-cars-original.png" alt="Gráfico original">
        </div>
    </div>
    <div class="row m-2 text-center">
        <div class="col">
            <p class="fw-bold fs-5 text-start">Redesign 1:</p>
            <svg id="redesign-1"></svg>

    </div>
    <div class="row m-2 text-center">
        <div class="col">
            <p class="fw-bold fs-5 text-start">Redesign 2:</p>
            <svg id="redesign-2"></svg>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
